<nav><a href="{{ site.github.repository_url }}/blob/{{ site.branch_name }}/Readme.md">README・使い方</a> · <a href="{{ '/quality.html' | relative_url }}">テスト・性能</a>
{% if site.sirkit_revision_date %}<a class="commit-badge" href="{{ site.github.repository_url }}/commit/{{ site.branch_name }}" title="このサイトの生成元コミット">Last Commit <time datetime="{{ site.sirkit_revision_date }}">{{ site.sirkit_revision_date }}</time></a>{% endif %}
</nav>
<div class="page-badges">
  <a href="{{ '/licenses/index.html' | relative_url }}"><img src="https://img.shields.io/badge/license-CC0%201.0-blue" alt="ライセンス CC0 1.0"></a>
  <a href="{{ site.github.repository_url }}/releases/latest"><img src="https://img.shields.io/github/v/release/{{ site.github.repository_nwo }}?display_name=tag&amp;sort=date" alt="最新リリース"></a>
  <a href="{{ site.github.repository_url }}/actions/workflows/verify.yml?query=event%3Apull_request"><img src="{{ site.github.repository_url }}/actions/workflows/verify.yml/badge.svg?event=pull_request" alt="main向けPRのVerify"></a>
</div>
