<style>
body { color: #243247; font-size: 15px; }
h1, h2, h3 { color: #17375d; }
table { display: block; overflow-x: auto; }
th { background: #eef4fb; }
td, th { padding: 8px 10px; }
.snapshot-note { padding: 10px 14px; background: #fff5dc; border-left: 3px solid #c48b00; }
nav { margin-bottom: 16px; }
details { margin: 12px 0; }
summary { cursor: pointer; color: #315d91; }
.page-licenses { position: static; width: auto; margin-top: 32px; }
.api-reference-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.source-meta { color: #667085; font-size: 13px; }
.commit-badge, .verify-badge { display: inline-block; padding: 2px 7px; margin-left: 6px; border-radius: 4px;
                              background: #eef4fb; color: #24486d; font-size: 12px; }
.verify-badge { background: #eaf6ee; color: #175b34; }
.verify-check { color: #187646; font-weight: bold; }
.page-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 16px; }
.page-badges img { display: block; }
.verification-details { margin-top: 20px; }
.language-text pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.code-version-selection, .code-version-picker > section { width: auto; float: none; padding: 0; }
.code-version-picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 14px; }
.code-version-picker > section { padding: 14px; border: 1px solid #d8e3ef; border-radius: 8px; }
.code-version-picker ul, .code-version-list { padding: 0; margin: 0 0 18px; list-style: none; }
.code-version-picker ul { margin: 0; }
.code-version-picker li + li { margin-top: 6px; }
.code-version-picker li a { display: block; padding: 5px 9px; border-radius: 4px; background: #eef4fb; }
.code-version-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px;
                        align-items: start; padding: 6px 0; border-bottom: 1px solid #e6ebf1; }
.code-version-list small { display: block; color: #667085; overflow-wrap: anywhere; }
.code-variant-download { white-space: nowrap; }
.code-version-selected { display: none; }
.code-version-selected:target { display: block; padding: 8px 12px; background: #eef4fb; }
.library-search { width: auto; float: none; padding: 0; margin: 16px 0 24px; }
.library-search label { display: block; margin-bottom: 6px; color: #17375d; font-weight: bold; }
.library-search input { box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 12px;
                        border: 1px solid #708399; border-radius: 6px; color: inherit; background: #fff;
                        font: inherit; font-size: 16px; }
.library-search input:focus-visible { outline: 2px solid #24568e; outline-offset: 2px; }
.library-search-status { margin: 8px 0; color: #4b5c71; }
.library-search-status:empty { margin: 0; }
.library-search-group { align-self: center; color: #4b5c71; font-size: 13px; }
.library-search [hidden], .library-search[hidden], [data-library-catalog][hidden] { display: none; }
</style>
