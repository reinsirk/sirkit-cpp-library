# SPDX-License-Identifier: CC0-1.0
# 参考: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Library pages

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

# VerifyのPR検査と別のグループ。未マージPRはこのworkflowで公開しない。
concurrency:
  group: library-pages-main
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - name: Check out the reviewed merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.6.9"
      - name: Install competitive-verifier
        run: python3 -m pip install -r .competitive-verifier/requirements.txt
      - name: Locate the exact PR head's completed Verify run
        id: reports
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
          PAGES_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PAGES_PR_NUMBER: ${{ github.event.pull_request.number }}
          PAGES_MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python3 - <<'PYREPORTS'
          import datetime, json, os, re, subprocess
          from pathlib import Path

          repository = os.environ["PAGES_REPOSITORY"]
          head = os.environ["PAGES_PR_HEAD"]
          merge = os.environ["PAGES_MERGE_COMMIT"]
          number = int(os.environ["PAGES_PR_NUMBER"])
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise ValueError("invalid repository")
          if not all(re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", value) for value in (head, merge)) or number <= 0:
              raise ValueError("invalid pull-request commit or number")
          directory = Path(os.environ["RUNNER_TEMP"])
          (directory / "pages-input").mkdir(parents=True, exist_ok=True)
          metadata = {"format": 1, "repository": repository, "pull_request": number,
                      "requested_head_sha": head, "merged_commit_sha": merge,
                      "selection_status": "UNAVAILABLE", "run": None, "artifacts": [],
                      "source_validation": "Each downloaded report is compared with the merged source SHA-256 by ci_quality_report.",
                      "recorded_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          run_id, artifact_ids = "", []

          def query(endpoint, fields=()):
              command = ["gh", "api", "--method", "GET", "--paginate", "--slurp", endpoint]
              for key, value in fields:
                  command += ["-f", key + "=" + str(value)]
              result = subprocess.run(command, capture_output=True, text=True, check=True, timeout=120)
              pages = json.loads(result.stdout)
              if not isinstance(pages, list) or not all(isinstance(page, dict) for page in pages):
                  raise ValueError("invalid GitHub API response")
              return pages

          try:
              pages = query("repos/" + repository + "/actions/workflows/verify.yml/runs",
                            [("event", "pull_request"), ("status", "completed"), ("head_sha", head), ("per_page", 100)])
              candidates = []
              for page in pages:
                  for row in page.get("workflow_runs", []):
                      if (not isinstance(row, dict) or row.get("event") != "pull_request"
                              or row.get("status") != "completed" or row.get("head_sha") != head
                              or not isinstance(row.get("repository"), dict)
                              or row["repository"].get("full_name") != repository
                              or type(row.get("id")) is not int or row["id"] <= 0
                              or type(row.get("run_number")) is not int or row["run_number"] <= 0
                              or type(row.get("run_attempt")) is not int or row["run_attempt"] <= 0):
                          continue
                      matches = [pr for pr in row.get("pull_requests", []) if isinstance(pr, dict)
                                 and type(pr.get("number")) is int and pr["number"] == number
                                 and isinstance(pr.get("head"), dict) and pr["head"].get("sha") == head
                                 and isinstance(pr.get("base"), dict) and pr["base"].get("ref") == "main"]
                      if matches:
                          candidates.append(row)
              if candidates:
                  selected = max(candidates, key=lambda row: (row.get("run_number", 0), row.get("run_attempt", 0), row["id"]))
                  run_id = str(selected["id"])
                  metadata["run"] = {key: selected.get(key) for key in (
                      "id", "head_sha", "event", "status", "conclusion", "run_attempt", "html_url", "created_at", "updated_at")}
                  pages = query("repos/" + repository + "/actions/runs/" + run_id + "/artifacts", [("per_page", 100)])
                  permitted = re.compile(r"(?:local-verify-(?:g\+\+|clang\+\+)-(?:native|portable)|instrumented-(?:sanitizers|coverage)|representative-performance|contracts-(?:g\+\+|clang\+\+)-(?:native|portable)|library-checker-[0-7])\Z")
                  latest = {}
                  for page in pages:
                      for artifact in page.get("artifacts", []):
                          if (not isinstance(artifact, dict) or not isinstance(artifact.get("name"), str)
                                  or not permitted.fullmatch(artifact["name"]) or artifact.get("expired") is not False
                                  or type(artifact.get("id")) is not int or artifact["id"] <= 0):
                              continue
                          origin = artifact.get("workflow_run")
                          if origin is not None and (not isinstance(origin, dict) or origin.get("id") != selected["id"] or origin.get("head_sha") != head):
                              continue
                          old = latest.get(artifact["name"])
                          if old is None or artifact["id"] > old["id"]:
                              latest[artifact["name"]] = artifact
                  metadata["artifacts"] = [{key: artifact.get(key) for key in ("id", "name", "digest", "created_at", "size_in_bytes")}
                                           for artifact in sorted(latest.values(), key=lambda item: item["name"])]
                  artifact_ids = [str(item["id"]) for item in metadata["artifacts"]]
                  if artifact_ids:
                      metadata["selection_status"] = "AVAILABLE"
              if not artifact_ids:
                  print("::warning::一致するPR headのVerifyレポートがありません。ページには未計測・結果なしとして表示します。")
          except (OSError, ValueError, TypeError, subprocess.SubprocessError) as error:
              metadata["error_kind"] = type(error).__name__
              run_id, artifact_ids = "", []
              print("::warning::Verifyレポートを取得できません。オンラインACやローカルPASSを補いません。")
          (directory / "pages-download-provenance.json").write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("run_id=" + run_id + "\n")
              output.write("artifact_ids=" + ",".join(artifact_ids) + "\n")
          PYREPORTS
      - name: Download only the selected metadata artifacts
        if: steps.reports.outputs.artifact_ids != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.reports.outputs.run_id }}
          artifact-ids: ${{ steps.reports.outputs.artifact_ids }}
          path: ${{ runner.temp }}/pages-input
          merge-multiple: false
          digest-mismatch: error
      - name: Read Pages metadata (repository settings are not changed)
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Build the merged main site
        env:
          PAGES_BASEURL: ${{ steps.pages.outputs.base_path }}
        run: >-
          python3 Scripts/build_library_pages.py
          --report "$RUNNER_TEMP/pages-input"
          --output "$RUNNER_TEMP/library-pages"
          --production --baseurl "$PAGES_BASEURL" --render
      - name: Upload publication evidence
        uses: actions/upload-artifact@v7
        with:
          name: library-pages-publication-report
          path: |
            ${{ runner.temp }}/library-pages/reports/
            ${{ runner.temp }}/library-pages/build-result.json
            ${{ runner.temp }}/pages-download-provenance.json
          retention-days: 14
      - name: Upload the reviewed main site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/library-pages/site/

  deploy:
    if: >-
      needs.build.result == 'success' && github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed main artifact
        id: deployment
        uses: actions/deploy-pages@v5
