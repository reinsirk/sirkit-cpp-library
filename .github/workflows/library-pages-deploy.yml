# 参考: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
# 参考: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
name: Deploy library pages

on:
  workflow_run:
    workflows: [Library pages]
    types: [completed]

permissions: {}

jobs:
  prepare:
    name: Prepare the Pages archive
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/library-pages.yml' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
      commit: ${{ steps.publication.outputs.commit }}
    steps:
      - name: Check whether the site was built
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BUILD_RUN: ${{ github.event.workflow_run.id }}
          PAGES_BUILD_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$PAGES_BUILD_RUN" =~ ^[1-9][0-9]*$ && "$PAGES_BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAGES_BUILD_RUN/attempts/$PAGES_BUILD_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "build") | .conclusion')
          case "$conclusion" in
            success) echo 'built=true' >> "$GITHUB_OUTPUT" ;;
            skipped) echo 'The source workflow skipped the site build.' ;;
            *) printf 'Could not confirm the source build: %s\n' "$conclusion" >&2; exit 1 ;;
          esac
      - name: Download publication evidence
        if: steps.build.outputs.built == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: library-pages-publication-report-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/pages-evidence
          digest-mismatch: error
      - name: Confirm the site belongs to the current main commit
        id: publication
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BUILD_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pages-evidence/pages-download-provenance.json"
          commit=$(jq -er '.merged_commit_sha | strings | select(test("^[0-9a-f]{40}$"))' "$evidence")
          number=$(jq -er '.pull_request | numbers | select(. > 0 and . == floor)' "$evidence")
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$PAGES_BUILD_HEAD" \
            '.repository == $repo and .requested_head_sha == $head' "$evidence" >/dev/null
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$commit" != "$GITHUB_SHA" || "$commit" != "$main" ]]; then
            echo 'A newer main commit supersedes this site build.'
            exit 0
          fi
          gh api -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$GITHUB_REPOSITORY/pulls/$number" |
            jq -e --arg sha "$commit" --arg repo "$GITHUB_REPOSITORY" --arg head "$PAGES_BUILD_HEAD" \
              '.merged == true and .base.ref == "main" and .base.repo.full_name == $repo and
               .merge_commit_sha == $sha and .head.sha == $head' >/dev/null
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Download the site archive
        if: steps.publication.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: github-pages-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/pages-package
          digest-mismatch: error
      - name: Pass the site archive to the deployment
        if: steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-package/artifact.tar
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy the prepared Pages archive
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    concurrency:
      group: library-pages-deploy-main
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck the main commit before deploying
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_PREPARED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$PAGES_PREPARED_COMMIT" =~ ^[0-9a-f]{40}$ && "$PAGES_PREPARED_COMMIT" == "$GITHUB_SHA" ]]
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$PAGES_PREPARED_COMMIT" != "$main" ]]; then
            echo 'A newer main commit supersedes this site build.'
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Deploy the reviewed main artifact
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
