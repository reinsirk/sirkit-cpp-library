name: Verify
run-name: 'Verify PR #${{ github.event.pull_request.number }}'

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SIRKIT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: Generated files and status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generated source and Verify synchronization
        run: python3 -c 'from pathlib import Path; from Scripts.package_revised_libraries import check_generated; check_generated(Path.cwd())'
      - name: README and online status synchronization
        run: python3 Scripts/update_verify_status.py --check

  python_tests:
    name: Python unit tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-15 clang-18 llvm-18 clang-tidy-18 libclang-rt-18-dev libboost-dev
      - name: Install documentation test dependencies
        run: python3 -m pip install -r .competitive-verifier/requirements.txt
      - name: Compiler availability
        run: |
          g++-15 --version
          clang++-18 --version
      - name: Python unit tests
        env:
          SIRKIT_CLANG_TIDY: clang-tidy-18
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          export SIRKIT_TIDY_GCC_INSTALL_DIR="$(dirname "$(g++-15 -print-libgcc-file-name)")"
          python3 - <<'PY'
          import os
          import unittest

          loader = unittest.TestLoader()
          discovered = loader.discover("Scripts/tests", pattern="test_*.py")
          if loader.errors:
              raise SystemExit("\n".join(loader.errors))
          modules = [suite for suite in discovered if suite.countTestCases()]
          tests = unittest.TestSuite(modules[int(os.environ["TEST_SHARD"])::2])
          if not tests.countTestCases():
              raise SystemExit("No Python unit tests in this shard")
          raise SystemExit(not unittest.TextTestRunner().run(tests).wasSuccessful())
          PY

  examples:
    name: C++23 (${{ matrix.compiler }}, ${{ matrix.arithmetic }}${{ matrix.compile_profile != 'standard' && ', AtCoder' || '' }}${{ matrix.architecture == 'arm64' && ', ARM64' || '' }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        arithmetic: [native, portable]
        compile_profile: [standard]
        architecture: [amd64, arm64]
        include:
          - {compiler: g++, arithmetic: native, compile_profile: atcoder, architecture: amd64}
          - {compiler: clang++, arithmetic: native, compile_profile: atcoder-clang, architecture: amd64}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install compilers
        if: matrix.compile_profile != 'atcoder-clang'
        env:
          VERIFY_COMPILER_FAMILY: ${{ matrix.compiler }}
        run: |
          sudo apt-get update
          packages=(g++-15 libboost-dev)
          if [[ "$VERIFY_COMPILER_FAMILY" == clang++ ]]; then
            packages+=(clang-18)
          fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Install Clang for the AtCoder profile
        if: matrix.compile_profile == 'atcoder-clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-21 lld-21 libc++-21-dev libomp-21-dev libclang-rt-21-dev libunwind-21-dev libboost-dev
      - name: Select and run local Verify
        env:
          VERIFY_COMPILER: ${{ matrix.compiler == 'g++' && 'g++-15' || matrix.compile_profile == 'atcoder-clang' && 'clang++-21' || 'clang++-18' }}
          VERIFY_ARITHMETIC: ${{ matrix.arithmetic }}
          VERIFY_COMPILE_PROFILE: ${{ matrix.compile_profile }}
          VERIFY_RESULTS: ${{ runner.temp }}/verify-results
        shell: bash
        run: |
          set -euo pipefail
          args=(--all --compiler "$VERIFY_COMPILER" --compile-profile "$VERIFY_COMPILE_PROFILE"
                --jobs 4 --skip-sync --results "$VERIFY_RESULTS/result.json")
          if [[ "$VERIFY_ARITHMETIC" == portable ]]; then
            args+=(--fallback)
          fi
          python3 Scripts/ci_verify.py "${args[@]}"
      - name: Summarize local Verify
        if: always()
        env:
          VERIFY_RESULTS: ${{ runner.temp }}/verify-results
        run: python3 Scripts/ci_verify_summary.py "$VERIFY_RESULTS/result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach report provenance
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/verify-results/result.json
        run: |
          python3 - <<'PYPROVENANCE'
          import json, os
          from pathlib import Path
          path = Path(os.environ["REPORT_FILE"])
          if path.is_file():
              value = json.loads(path.read_text())
              current = {key.lower(): os.environ.get(key) for key in (
                  "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY", "GITHUB_JOB", "RUNNER_ARCH")}
              current["pull_request_head_sha"] = os.environ.get("SIRKIT_PR_HEAD_SHA")
              value.setdefault("provenance", {}).update(current)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n")
          PYPROVENANCE
      - name: Upload local Verify report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.compile_profile != 'standard' && 'atcoder-local-verify' || 'local-verify' }}${{ matrix.architecture == 'arm64' && '-arm64' || '' }}-${{ matrix.compiler }}-${{ matrix.arithmetic }}
          path: ${{ runner.temp }}/verify-results/
          if-no-files-found: ignore
          retention-days: 14

  variant_builds:
    name: 配布版のビルド・動作検査 (${{ matrix.compiler }}${{ matrix.msvc_arch == 'arm64' && ', ARM64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-26.04, compiler: GCC}
          - {os: ubuntu-26.04, compiler: Clang}
          - {os: windows-2025, compiler: MSVC, msvc_arch: x64}
          - {os: windows-11-vs2026-arm, compiler: MSVC, msvc_arch: arm64}
    steps:
      - name: Keep source bytes for SHA verification
        if: matrix.compiler == 'MSVC'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read pinned ACL revision
        id: acl
        shell: bash
        run: |
          set -euo pipefail
          commit="$(cat Verify/current/vendor/ACL_COMMIT)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: atcoder/ac-library
          ref: ${{ steps.acl.outputs.commit }}
          path: .verify-acl
          persist-credentials: false
      - name: Install Linux compilers
        if: matrix.compiler != 'MSVC'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-15 clang-18
      - name: Find Visual Studio developer command
        if: matrix.compiler == 'MSVC'
        env:
          SIRKIT_MSVC_ARCH: ${{ matrix.msvc_arch }}
        shell: pwsh
        run: |
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
          $component = if ($env:SIRKIT_MSVC_ARCH -eq 'arm64') {
            'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          } else {
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          }
          $install = & $vswhere -latest -products '*' -requires $component -property installationPath
          if (-not $install) { throw "Visual Studio C++ tools not found" }
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvarsall.bat"
          "SIRKIT_VCVARS=$vcvars" >> $env:GITHUB_ENV
      - name: Verify common and compiler-specific variants on Linux
        if: matrix.compiler != 'MSVC'
        shell: bash
        run: >-
          python3 Scripts/verify_variants.py --compiler "${{ matrix.compiler }}"
          --gcc g++-15 --clang clang++-18
          --gcc-install-dir "$(dirname "$(g++-15 -print-libgcc-file-name)")"
          --syntax-only --run-tests --jobs 4 --acl-include .verify-acl
          --output "$RUNNER_TEMP/variant-builds.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify common and MSVC-specific variants on Windows
        if: matrix.compiler == 'MSVC'
        env:
          SIRKIT_MSVC_ARCH: ${{ matrix.msvc_arch }}
        shell: cmd
        run: |
          call "%SIRKIT_VCVARS%" %SIRKIT_MSVC_ARCH% || exit /b 1
          where cl | findstr /I /L /C:"\Host%SIRKIT_MSVC_ARCH%\%SIRKIT_MSVC_ARCH%\cl.exe" >nul || exit /b 1
          cd /d "%GITHUB_WORKSPACE%"
          python -X utf8 Scripts/verify_variants.py --compiler MSVC --syntax-only --run-tests --jobs 2 --acl-include .verify-acl --output "%RUNNER_TEMP%\variant-builds.json" --summary "%GITHUB_STEP_SUMMARY%"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: variant-builds-${{ matrix.compiler }}${{ matrix.msvc_arch == 'arm64' && '-ARM64' || '' }}
          path: ${{ runner.temp }}/variant-builds.json
          if-no-files-found: ignore
          retention-days: 14

  cross_architecture:
    name: QEMU Verify (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: loongarch64, toolchain: loongarch64-linux-gnu}
          - {target: riscv64, toolchain: riscv64-linux-gnu}
          - {target: ppc64le, toolchain: powerpc64le-linux-gnu}
          - {target: s390x, toolchain: s390x-linux-gnu}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install cross compiler and emulator
        env:
          SIRKIT_CROSS_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "g++-15-$SIRKIT_CROSS_TOOLCHAIN" qemu-user libboost-dev
      - name: Run all local Verify in QEMU
        env:
          SIRKIT_CROSS_TOOLCHAIN: ${{ matrix.toolchain }}
          SIRKIT_CROSS_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/ci_verify.py --all --compiler "$SIRKIT_CROSS_TOOLCHAIN-g++-15" \
            --qemu "qemu-$SIRKIT_CROSS_TARGET" --fallback --jobs 4 --skip-sync \
            --results "$RUNNER_TEMP/qemu-verify/result.json"
      - name: Run additional library tests in QEMU
        env:
          SIRKIT_CROSS_TOOLCHAIN: ${{ matrix.toolchain }}
          SIRKIT_CROSS_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          tests=(prefix_sum_reference_test prefix_sum_nd_reference_test persistent_array_reference_test fast_io_test dynamic_bitset_reference_test)
          for test in "${tests[@]}"; do
            for mode in checked skip; do
              options=()
              if [[ "$mode" == skip ]]; then options=(-DSKIP_RUNTIME_CHECKS); fi
              binary="$RUNNER_TEMP/$test-$mode"
              "$SIRKIT_CROSS_TOOLCHAIN-g++-15" -std=c++23 -O2 -static "${options[@]}" "Verify/current/tests/$test.cpp" -o "$binary"
              timeout 120 "qemu-$SIRKIT_CROSS_TARGET" "$binary"
              printf '%s (%s): PASS\n' "$test" "$mode"
            done
          done
      - name: Summarize QEMU Verify
        if: always()
        env:
          SIRKIT_CROSS_TARGET: ${{ matrix.target }}
        run: |
          printf '## QEMU Verify (%s)\n\n' "$SIRKIT_CROSS_TARGET" >> "$GITHUB_STEP_SUMMARY"
          python3 Scripts/ci_verify_summary.py "$RUNNER_TEMP/qemu-verify/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qemu-verify-${{ matrix.target }}
          path: ${{ runner.temp }}/qemu-verify/result.json
          if-no-files-found: ignore
          retention-days: 14

  instrumented:
    name: C++23 (${{ matrix.mode }}, checked)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [sanitizers, coverage]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev g++-15 libboost-dev
          if [[ "${{ matrix.mode }}" == coverage ]]; then
            sudo apt-get install -y qemu-user g++-15-multilib
          fi
      - name: Prepare generic AMD64 build environment for QEMU
        if: matrix.mode == 'coverage'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qemu-amd64" "$RUNNER_TEMP/qemu-amd64-packages/lists/partial"
          cd "$RUNNER_TEMP/qemu-amd64-packages"
          source /etc/os-release
          # 汎用AMD64の候補を、ランナーのAMD64v3用索引やインストール済み版から分離する。
          mkdir empty.d
          touch empty-status
          cat > generic-apt.conf <<EOF
          #clear APT::Architecture-Variants;
          #clear APT::Architectures;
          APT::Architecture "amd64";
          APT::Architectures { "amd64"; };
          Dir::Etc::sourcelist "$PWD/ubuntu.list";
          Dir::Etc::sourceparts "$PWD/empty.d";
          Dir::Etc::preferences "/dev/null";
          Dir::Etc::preferencesparts "$PWD/empty.d";
          Dir::State::lists "$PWD/lists";
          Dir::State::status "$PWD/empty-status";
          Dir::Cache::pkgcache "";
          Dir::Cache::srcpkgcache "";
          Acquire::Languages "none";
          EOF
          cat > ubuntu.list <<EOF
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $VERSION_CODENAME main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $VERSION_CODENAME-updates main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu $VERSION_CODENAME-security main universe
          EOF
          apt-get -c generic-apt.conf update --error-on=any
          packages=(libc6:amd64 libc6-dev:amd64 linux-libc-dev:amd64
                    libstdc++6:amd64 libgcc-s1:amd64 libstdc++-15-dev:amd64 libgcc-15-dev:amd64
                    libclang-common-18-dev:amd64 libclang-rt-18-dev:amd64)
          apt-get -c generic-apt.conf download "${packages[@]}"
          for package in ./*.deb; do
            if [[ "$(dpkg-deb -f "$package" Architecture)" != amd64 || -n "$(dpkg-deb -f "$package" Architecture-Variant)" ]]; then
              printf '汎用AMD64パッケージが必要です: %s\n' "$package" >&2
              exit 1
            fi
            dpkg-deb -x "$package" "$RUNNER_TEMP/qemu-amd64"
          done
          ln -s usr/lib "$RUNNER_TEMP/qemu-amd64/lib"
          ln -s usr/lib64 "$RUNNER_TEMP/qemu-amd64/lib64"
      - name: Run checked library tests
        env:
          VERIFY_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--jobs 4)
          if [[ "$VERIFY_MODE" == coverage ]]; then
            options+=(--timeout 240 --x86-baseline-sysroot "$RUNNER_TEMP/qemu-amd64")
          fi
          python3 Scripts/ci_instrumented.py \
            --mode "$VERIFY_MODE" --compiler clang++-18 \
            --gcc-install-dir "$(dirname "$(g++-15 -print-libgcc-file-name)")" \
            --llvm-profdata llvm-profdata-18 --llvm-cov llvm-cov-18 \
            --gcc g++-15 --gcov gcov-15 "${options[@]}" \
            --output "$RUNNER_TEMP/instrumented"
      - name: Summarize instrumentation
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/instrumented/summary.md" ]]; then
            cat "$RUNNER_TEMP/instrumented/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '計測結果が生成されませんでした。ログを確認してください。\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Attach report provenance
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/instrumented/results.json
        run: |
          python3 - <<'PYPROVENANCE'
          import json, os
          from pathlib import Path
          path = Path(os.environ["REPORT_FILE"])
          if path.is_file():
              value = json.loads(path.read_text())
              current = {key.lower(): os.environ.get(key) for key in (
                  "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY", "GITHUB_JOB")}
              current["pull_request_head_sha"] = os.environ.get("SIRKIT_PR_HEAD_SHA")
              value.setdefault("provenance", {}).update(current)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n")
          PYPROVENANCE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-${{ matrix.mode }}
          path: ${{ runner.temp }}/instrumented/
          if-no-files-found: ignore
          retention-days: 14

  guidelines:
    name: C++ style (${{ matrix.guide }}, normal only)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        guide: [core, google]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 g++-15
      - name: Check normal library sources
        env:
          CPP_GUIDE: ${{ matrix.guide }}
        run: >-
          python3 Scripts/ci_cpp_guidelines.py
          --clang-tidy clang-tidy-18
          --gcc-install-dir "$(dirname "$(g++-15 -print-libgcc-file-name)")"
          --guide "$CPP_GUIDE" --jobs 4
          --output "$RUNNER_TEMP/guidelines"
      - name: Summarize guidelines
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/guidelines/summary.md" ]]; then
            cat "$RUNNER_TEMP/guidelines/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '作法検査の結果が生成されませんでした。ログを確認してください。\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpp-guidelines-${{ matrix.guide }}-normal
          path: ${{ runner.temp }}/guidelines/
          if-no-files-found: ignore
          retention-days: 14

  stress:
    name: Deterministic Max and structural cases
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-15
      - name: Run deterministic full-size cases
        run: >-
          python3 Scripts/ci_stress.py --compiler g++-15
          --case-timeout 60
          --output "$RUNNER_TEMP/stress-cases"
      - name: Summarize Max and structural cases
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/stress-cases/summary.md" ]]; then
            cat "$RUNNER_TEMP/stress-cases/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Max・構造ケースの結果が生成されませんでした。\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Attach report provenance
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/stress-cases/result.json
        run: |
          python3 - <<'PYPROVENANCE'
          import json, os
          from pathlib import Path
          path = Path(os.environ["REPORT_FILE"])
          if path.is_file():
              value = json.loads(path.read_text())
              current = {key.lower(): os.environ.get(key) for key in (
                  "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY", "GITHUB_JOB")}
              current["pull_request_head_sha"] = os.environ.get("SIRKIT_PR_HEAD_SHA")
              value.setdefault("provenance", {}).update(current)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n")
          PYPROVENANCE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stress-cases
          path: |
            ${{ runner.temp }}/stress-cases/result.json
            ${{ runner.temp }}/stress-cases/summary.md
          if-no-files-found: ignore
          retention-days: 14

  contracts:
    name: Checked API contracts (${{ matrix.compiler }}, ${{ matrix.arithmetic }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        arithmetic: [native, portable]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-15 clang-18
      - name: Check normal results and expected failures
        env:
          CONTRACT_COMPILER: ${{ matrix.compiler == 'g++' && 'g++-15' || 'clang++-18' }}
          CONTRACT_ARITHMETIC: ${{ matrix.arithmetic }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--compiler "$CONTRACT_COMPILER" --output "$RUNNER_TEMP/contracts")
          if [[ "$CONTRACT_COMPILER" == clang++-18 ]]; then
            args+=(--gcc-install-dir "$(dirname "$(g++-15 -print-libgcc-file-name)")")
          fi
          if [[ "$CONTRACT_ARITHMETIC" == portable ]]; then
            args+=(--fallback)
          fi
          python3 Scripts/ci_contracts.py "${args[@]}"
      - name: Summarize contracts
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/contracts/summary.md" ]]; then
            cat "$RUNNER_TEMP/contracts/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Attach report provenance
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/contracts/result.json
        run: |
          python3 - <<'PYPROVENANCE'
          import json, os
          from pathlib import Path
          path = Path(os.environ["REPORT_FILE"])
          if path.is_file():
              value = json.loads(path.read_text())
              current = {key.lower(): os.environ.get(key) for key in (
                  "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY", "GITHUB_JOB")}
              current["pull_request_head_sha"] = os.environ.get("SIRKIT_PR_HEAD_SHA")
              value.setdefault("provenance", {}).update(current)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n")
          PYPROVENANCE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contracts-${{ matrix.compiler }}-${{ matrix.arithmetic }}
          path: ${{ runner.temp }}/contracts/
          if-no-files-found: ignore
          retention-days: 14

  library_checker:
    name: Official Library Checker cases (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-15
      - name: Run all official full cases
        env:
          VERIFY_PR_BASE: ${{ github.event.pull_request.base.sha }}
          VERIFY_SHARD: ${{ matrix.shard }}
        run: >-
          python3 Scripts/ci_library_checker.py --all --discard-test-data
          --base "$VERIFY_PR_BASE"
          --shard-index "$VERIFY_SHARD" --shard-count 8
          --compiler g++-15
          --case-timeout 30
          --cache "$RUNNER_TEMP/library-checker-cache"
          --output "$RUNNER_TEMP/library-checker-report"
      - name: Attach report provenance
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/library-checker-report/result.json
        run: |
          python3 - <<'PYPROVENANCE'
          import json, os
          from pathlib import Path
          path = Path(os.environ["REPORT_FILE"])
          if path.is_file():
              value = json.loads(path.read_text())
              current = {key.lower(): os.environ.get(key) for key in (
                  "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY", "GITHUB_JOB")}
              current["pull_request_head_sha"] = os.environ.get("SIRKIT_PR_HEAD_SHA")
              value.setdefault("provenance", {}).update(current)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n")
          PYPROVENANCE
      - name: Summarize official cases
        if: always()
        run: |
          python3 - <<'PYSUMMARY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "library-checker-report/result.json"
          if path.is_file():
              value = json.loads(path.read_text())
              counts = value.get("counts", {})
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("## 公式ケースのローカル実行\n\n")
                  summary.write("状態: " + str(value.get("status")) + "\n\n")
                  summary.write("対象: " + str(counts.get("selected", 0)) + "、完了ケース: " + str(counts.get("case_completed", 0)) + "\n\n")
                  summary.write("Library CheckerのオンラインACとは別の結果です。\n")
          PYSUMMARY
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-checker-${{ matrix.shard }}
          path: ${{ runner.temp }}/library-checker-report/result.json
          if-no-files-found: ignore
          retention-days: 14

  yomiyasu:
    name: Japanese documentation (yomiyasu)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Find latest yomiyasu release
        id: yomiyasu-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(curl --fail --silent --show-error --retry 3 --max-time 20 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/nanaism/yomiyasu/releases/latest \
            | jq -er '.tag_name | strings | select(length > 0)')"
          git check-ref-format "refs/tags/$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Fetch latest yomiyasu release
        uses: actions/checkout@v7
        with:
          repository: nanaism/yomiyasu
          ref: refs/tags/${{ steps.yomiyasu-release.outputs.tag }}
          path: .ci-yomiyasu
          persist-credentials: false
      - name: Lint changed documentation
        env:
          VERIFY_PR_BASE: ${{ github.event.pull_request.base.sha }}
          YOMIYASU_TAG: ${{ steps.yomiyasu-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/.ci-yomiyasu"
          linter="$tool/skills/yomiyasu/scripts/yomiyasu_lint.py"
          revision="$(git -C "$tool" rev-parse HEAD)"
          python3 "$linter" --version
          git diff --name-only --diff-filter=ACMRT -z "$VERIFY_PR_BASE" HEAD -- \
            ':(icase,glob)**/*.md' ':(icase,glob)**/*.markdown' \
            ':(glob).competitive-verifier/docs/static/**/*.html' > "$RUNNER_TEMP/yomiyasu-paths"
          checked=0
          failed=0
          while IFS= read -r -d '' path; do
            printf '\n--- %q ---\n' "$path"
            checked=$((checked + 1))
            if [[ -L "$path" || ! -f "$path" ]]; then
              printf '通常のファイルを読み込めません。\n' >&2
              failed=$((failed + 1))
            elif ! python3 "$linter" --fail-on error - < "$path"; then
              failed=$((failed + 1))
            fi
          done < "$RUNNER_TEMP/yomiyasu-paths"
          printf '## yomiyasu\n\nリリース `%s`（`%s`）\n\n検査した文書 %s件、失敗 %s件。詳細は検査ステップのログにあります。\n' \
            "$YOMIYASU_TAG" "$revision" "$checked" "$failed" >> "$GITHUB_STEP_SUMMARY"
          [[ "$failed" == 0 ]]

  documentation:
    name: Library pages preview
    if: ${{ !cancelled() && needs.generated.result == 'success' }}
    needs: [generated, examples, instrumented, contracts, library_checker]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.6.9"
      - name: Install competitive-verifier
        run: python3 -m pip install -r .competitive-verifier/requirements.txt
      - name: Create report directory
        run: mkdir -p "$RUNNER_TEMP/pages-input"
      - uses: actions/download-artifact@v8
        with:
          pattern: local-verify-*
          path: ${{ runner.temp }}/pages-input
          merge-multiple: false
      - uses: actions/download-artifact@v8
        with:
          pattern: instrumented-*
          path: ${{ runner.temp }}/pages-input
          merge-multiple: false
      - uses: actions/download-artifact@v8
        with:
          pattern: contracts-*
          path: ${{ runner.temp }}/pages-input
          merge-multiple: false
      - uses: actions/download-artifact@v8
        with:
          pattern: library-checker-*
          path: ${{ runner.temp }}/pages-input
          merge-multiple: false
      - name: Build preview with source-bound reports
        run: >-
          python3 Scripts/build_library_pages.py
          --report "$RUNNER_TEMP/pages-input"
          --output "$RUNNER_TEMP/library-pages"
          --baseurl "" --render
      - name: Upload HTML preview and report snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-pages-preview
          path: |
            ${{ runner.temp }}/library-pages/site/
            ${{ runner.temp }}/library-pages/reports/
            ${{ runner.temp }}/library-pages/build-result.json
          if-no-files-found: ignore
          retention-days: 14

  result:
    name: Verify result
    if: always()
    needs: [generated, python_tests, examples, variant_builds, cross_architecture, instrumented, guidelines, contracts, library_checker, stress, yomiyasu, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          GENERATED_RESULT: ${{ needs.generated.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python_tests.result }}
          VERIFY_RESULT: ${{ needs.examples.result }}
          VARIANT_BUILDS_RESULT: ${{ needs.variant_builds.result }}
          CROSS_ARCH_RESULT: ${{ needs.cross_architecture.result }}
          INSTRUMENTED_RESULT: ${{ needs.instrumented.result }}
          GUIDELINES_RESULT: ${{ needs.guidelines.result }}
          CONTRACT_RESULT: ${{ needs.contracts.result }}
          LIBRARY_CHECKER_RESULT: ${{ needs.library_checker.result }}
          STRESS_RESULT: ${{ needs.stress.result }}
          YOMIYASU_RESULT: ${{ needs.yomiyasu.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## Verify\n\n| 検査 | 結果 |\n| --- | --- |\n'
            printf '| 生成物・README集計 | %s |\n' "$GENERATED_RESULT"
            printf '| Pythonテスト（2分割） | %s |\n' "$PYTHON_TESTS_RESULT"
            printf '| C++23 Verify（AMD64・ARM64） | %s |\n' "$VERIFY_RESULT"
            printf '| 配布8版の単独ビルド・動作検査 | %s |\n' "$VARIANT_BUILDS_RESULT"
            printf '| 4アーキテクチャのQEMU全件Verify | %s |\n' "$CROSS_ARCH_RESULT"
            printf '| ASan/UBSan・カバレッジ（checked） | %s |\n' "$INSTRUMENTED_RESULT"
            printf '| Core Guidelines・Google Style（通常版のみ） | %s |\n' "$GUIDELINES_RESULT"
            printf '| checked正常系・期待した失敗系 | %s |\n' "$CONTRACT_RESULT"
            printf '| 公式Library Checkerケース（ローカル） | %s |\n' "$LIBRARY_CHECKER_RESULT"
            printf '| 決定的Max・構造ケース | %s |\n' "$STRESS_RESULT"
            printf '| 日本語文書の書式・表現（yomiyasu） | %s |\n' "$YOMIYASU_RESULT"
            printf '| ライブラリページのプレビュー | %s |\n' "$DOCUMENTATION_RESULT"
            printf '\nローカル検証の結果です。オンラインACはREADMEのVerify一覧で別に管理します。\n'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$GENERATED_RESULT" == success && "$PYTHON_TESTS_RESULT" == success && "$VERIFY_RESULT" == success && "$VARIANT_BUILDS_RESULT" == success && "$CROSS_ARCH_RESULT" == success && "$INSTRUMENTED_RESULT" == success && "$GUIDELINES_RESULT" == success && "$CONTRACT_RESULT" == success && "$LIBRARY_CHECKER_RESULT" == success && "$STRESS_RESULT" == success && "$YOMIYASU_RESULT" == success && "$DOCUMENTATION_RESULT" == success ]]
